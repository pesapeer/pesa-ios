name: Release

# A signed tag vX.Y.Z is the Swift Package Manager release (SPM resolves the
# tag directly) and pushes the pod to CocoaPods trunk. Needs the repository
# secret COCOAPODS_TRUNK_TOKEN (from `pod trunk register`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag signature
        run: .github/verify-tag.sh "${GITHUB_REF_NAME}"
      - name: Check the tag matches the podspec
        run: |
          v=$(sed -n "s/.*s.version *= *'\([^']*\)'.*/\1/p" PesaCheckout.podspec)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "podspec is $v, tag is ${GITHUB_REF_NAME}" >&2; exit 1; }
      - run: swift build
      - run: swift test
      - run: >-
          xcodebuild -scheme PesaCheckout
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation build
      - run: pod lib lint --allow-warnings
      - run: pod trunk push PesaCheckout.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
